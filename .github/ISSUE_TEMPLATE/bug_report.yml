name: Bug report
description: Report a reproducible Ruckus defect without private user data.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: Do not include credentials, emails, chat text, report evidence, or QR tokens.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Build, platform, and OS
