name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App quality and exports
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run scan:secrets
      - run: npm run audit:production
      - run: npx expo export --platform web --output-dir dist/web
      - run: npx expo export --platform ios --output-dir dist/ios
      - run: npx expo export --platform android --output-dir dist/android

  functions:
    name: Edge Function typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

  database:
    name: Database policies and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run test:event-capacity
      - run: npm run test:matching
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
