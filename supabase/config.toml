project_id = "campus-clash"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "ruckus://auth/callback"
additional_redirect_urls = [
  "exp://127.0.0.1:8081/--/auth/callback",
  "ruckus://auth/callback",
  "campusclash://auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false

[functions.match-activity-session]
verify_jwt = true

[functions.generate-checkin-token]
verify_jwt = true

[functions.redeem-checkin]
verify_jwt = true

[functions.notify-chat-message]
verify_jwt = true

[functions.notification-sweep]
verify_jwt = false

[functions.purge-deleted-accounts]
verify_jwt = false

[functions.process-push-receipts]
verify_jwt = false

[functions.recommendation-maintenance]
verify_jwt = false

[functions.analytics-maintenance]
verify_jwt = false

[functions.campus-announcement-publisher]
verify_jwt = false

[functions.partnership-lead]
verify_jwt = false
